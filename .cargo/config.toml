# Never strip on macOS. Apple's `strip` can leave the LINKEDIT string pool
# 4-byte aligned, and macOS 27's dyld refuses to load such an image when it was
# linked against the macOS 27 SDK (Apple's, from Xcode or the Command Line
# Tools) or later. Stripping saves nothing there: debug info stays out of the
# dylib. This overrides the release profile's `strip`.
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "strip=none"]
