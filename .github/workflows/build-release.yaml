name: Build and release

permissions:
  id-token: write
  contents: read
  actions: write

on:
  workflow_call:
    inputs:
      promote-to-test:
        description: >-
          Promote the release bundle to TEST after DEV. Releases do; dev-channel
          builds stop at DEV, since they only feed the SDK's pinned installs.
        required: false
        type: boolean
        default: true
      dry_run:
        description: Keep deploy and bundle creation in dry-run mode.
        required: false
        type: boolean
        default: true
      version-override:
        description: |
          Cargo-style version stamped ephemerally into the build workspace
          instead of the committed Cargo.toml version (dev-channel builds,
          e.g. "0.6.0-alpha.7.dev.123"). Empty means build the committed
          version as-is.
        required: false
        type: string
        default: ''
      wheel-set:
        description: |
          "full" builds the release cells in .github/build-matrix.yaml;
          "dev" builds the dev-channel cells (see that file's header).
        required: false
        type: string
        default: full

env:
  SHARED_WORKFLOWS_REF: 49381314f7afd64afb580b77bab8ac263040c27e # PyPI metadata SIGPIPE fix (post-v5.0.0)

jobs:
  extract-version:
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION || 'ubuntu-22.04' }}
    outputs:
      version: ${{ inputs.version-override != '' && inputs.version-override || steps.extract.outputs.release-version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Extract version
        id: extract
        uses: ./.github/actions/get-version

  plan-matrix:
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION || 'ubuntu-22.04' }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/build-matrix.yaml
          sparse-checkout-cone-mode: false
      - name: Select build cells
        id: plan
        env:
          WHEEL_SET: ${{ inputs.wheel-set }}
        run: |
          set -euo pipefail
          case "$WHEEL_SET" in
            full) filter='[.include[] | select(.dev != "only")]' ;;
            dev)  filter='[.include[] | select(.dev == true or .dev == "only")]' ;;
            *) echo "::error::wheel-set must be 'full' or 'dev', got '$WHEEL_SET'"; exit 1 ;;
          esac
          matrix=$(yq -o=json -I0 "{\"include\": $filter}" .github/build-matrix.yaml)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          yq -r "$filter | .[].name" .github/build-matrix.yaml | sed 's/^/  /'

  build-packages:
    name: build (${{ matrix.name }})
    needs: [extract-version, plan-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-matrix.outputs.matrix) }}
    uses: aerospike/shared-workflows/.github/workflows/reusable_execute-build.yaml@49381314f7afd64afb580b77bab8ac263040c27e # PyPI metadata SIGPIPE fix (post-v5.0.0)
    with:
      gh-workflows-ref: 49381314f7afd64afb580b77bab8ac263040c27e # PyPI metadata SIGPIPE fix (post-v5.0.0)
      runs-on: ${{ matrix.runs-on }}
      jf-project: ${{ vars.JFROG_PROJECT }}
      jf-build-name: aerospike-client-python-native
      jf-build-id: ${{ github.run_number }}-buildinfo-${{ matrix.name }}
      gh-checkout-path: shared-workflows
      gh-source-path: aerospike-client-python-native
      working-directory: aerospike-client-python-native
      setup-python: true
      python-version: ${{ matrix.python-version }}
      job-name: ${{ matrix.name }}
      build-env: PACKAGE_KIND=${{ matrix.package-kind }};PYTHON_INTERPRETER=${{ matrix.python-interpreter }};MATURIN_TARGET=${{ matrix.maturin-target }};MANYLINUX=${{ matrix.manylinux }};VERSION_OVERRIDE=${{ inputs.version-override }}
      build-script: |
        set -euo pipefail

        # Stamping runs on the host: the container mounts the workspace, so it
        # builds the stamped tree.
        if [[ -n "${VERSION_OVERRIDE:-}" ]]; then
          python .github/scripts/stamp_version.py "$VERSION_OVERRIDE"
        fi

        if [[ "$RUNNER_OS" == "Linux" && "$PACKAGE_KIND" == "wheel" ]]; then
          # Build inside the manylinux container: the image's glibc, not the
          # runner's, sets the wheel floor. Pinned to a dated tag because the
          # image contents change without warning (cp313-cp313t was removed
          # on 2026-05-07); bump deliberately.
          MANYLINUX_IMAGE_TAG=2026.09.05-1

          # PYTHON_INTERPRETER holds PEP 425 tags; resolve them against the
          # image's /opt/python tree.
          interpreters=()
          for tag in $PYTHON_INTERPRETER; do
            interpreters+=("/opt/python/${tag}/bin/python")
          done

          rm -rf build
          mkdir -p build

          docker run --rm -v "$PWD:/io" -w /io \
            -e AWS_LC_SYS_CMAKE_BUILDER=0 \
            -e AWS_LC_SYS_EXTERNAL_BINDGEN=0 \
            -e AWS_LC_SYS_NO_PREGENERATED_SRC=0 \
            "quay.io/pypa/manylinux_${MANYLINUX}_$(uname -m):${MANYLINUX_IMAGE_TAG}" \
            bash -euo pipefail -c "
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
                sh -s -- -y --profile minimal --default-toolchain 1.90.0
              export PATH=\"\$HOME/.cargo/bin:\$PATH\"
              pipx install 'maturin>=1.9.0,<2.0'
              maturin build --release --out build \
                --compatibility manylinux_${MANYLINUX} \
                --interpreter ${interpreters[*]}
            "
          # The container writes as root; the upload step runs as the runner user.
          sudo chown -R "$(id -u):$(id -g)" build
          exit 0
        fi

        python -m pip install --upgrade pip
        python -m pip install "maturin>=1.9.0,<2.0"
        rustup toolchain install 1.90.0 --profile minimal
        rustup default 1.90.0

        if [[ "$RUNNER_OS" == "Windows" ]]; then
          # Retry: the Chocolatey community feed rate-limits concurrent matrix
          # jobs, intermittently failing with "package not found".
          for i in 1 2 3 4 5; do
            choco install nasm -y && break
            echo "choco nasm attempt $i failed; retrying in $((i*10))s"
            sleep $((i*10))
          done
          export PATH="/c/Program Files/NASM:/c/ProgramData/chocolatey/bin:$PATH"
        fi

        export AWS_LC_SYS_CMAKE_BUILDER=0
        export AWS_LC_SYS_EXTERNAL_BINDGEN=0
        export AWS_LC_SYS_NO_PREGENERATED_SRC=0

        rm -rf build
        mkdir -p build

        if [[ "$PACKAGE_KIND" == "sdist" ]]; then
          maturin sdist --out build
          exit 0
        fi

        args=(build --release --out build --interpreter "$PYTHON_INTERPRETER")
        if [[ -n "$MATURIN_TARGET" ]]; then
          args+=(--target "$MATURIN_TARGET")
        fi

        maturin "${args[@]}"
      gh-artifact-directory: build
      gh-artifact-name: ${{ matrix.artifact-prefix || 'build-artifacts' }}-${{ matrix.name }}
      gh-retention-days: 1
      publish-build-info: true
      oidc-provider-name: ${{ vars.OIDC_PROVIDER_NAME || 'gh-aerospike' }}
      oidc-audience: ${{ vars.OIDC_AUDIENCE || 'aerospike' }}



  collect-artifacts:
    needs: [build-packages]
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION || 'ubuntu-22.04' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout shared-workflows actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: aerospike/shared-workflows
          ref: ${{ env.SHARED_WORKFLOWS_REF }}
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - name: Collect build artifacts
        uses: ./.github/actions/collect-build-artifacts
      - name: Checkout wheel checks
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: native
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Verify collected Python artifacts
        run: |
          set -euo pipefail
          for wheel in build-artifacts/*.whl; do
            unzip -t "$wheel" >/dev/null
          done
          # The Linux glibc floor is chosen by the manylinux_2_28 container, not
          # imposed by the runner. Assert it, so dropping back to a
          # runner-detected floor fails here instead of reaching a customer as
          # "no matching distribution found".
          for wheel in build-artifacts/*.whl; do
            name=$(basename "$wheel")
            case "$name" in
              *macosx*|*win32*|*win_amd64*|*win_arm64*) continue ;;
            esac
            case "$name" in
              *manylinux_2_28_x86_64*|*manylinux_2_28_aarch64*) ;;
              *) echo "::error::$name is a Linux wheel but not manylinux_2_28"; exit 1 ;;
            esac
          done
          shopt -s nullglob
          # macOS 27 refuses to load a misaligned string pool in an image
          # linked against the macOS 27 SDK.
          python3 native/.github/scripts/check_macho_strtab.py build-artifacts/*.whl
          for sdist in build-artifacts/*.tar.gz; do
            tar -tzf "$sdist" >/dev/null
          done

  deploy-artifacts:
    needs: [extract-version, collect-artifacts]
    uses: aerospike/shared-workflows/.github/workflows/reusable_deploy-artifacts.yaml@49381314f7afd64afb580b77bab8ac263040c27e # PyPI metadata SIGPIPE fix (post-v5.0.0)
    with:
      gh-workflows-ref: 49381314f7afd64afb580b77bab8ac263040c27e # PyPI metadata SIGPIPE fix (post-v5.0.0)
      runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION || 'ubuntu-22.04' }}
      jf-project: ${{ vars.JFROG_PROJECT }}
      jf-build-name: aerospike-client-python-native
      jf-metadata-build-id: ${{ github.run_number }}-buildinfo
      jf-build-id: ${{ github.run_number }}
      gh-artifact-name: build-artifacts
      # Python wheels produce no Maven metadata; explicit per the v4.0.0 upgrade table.
      gh-upload-bundle-metadata: false
      version: ${{ needs.extract-version.outputs.version }}
      gh-retention-days: 1
      oidc-provider-name: ${{ vars.OIDC_PROVIDER_NAME || 'gh-aerospike' }}
      oidc-audience: ${{ vars.OIDC_AUDIENCE || 'aerospike' }}
      dry-run: ${{ inputs.dry_run }}

  create-release-bundle:
    needs: [extract-version, deploy-artifacts]
    uses: aerospike/shared-workflows/.github/workflows/reusable_create-release-bundle.yaml@49381314f7afd64afb580b77bab8ac263040c27e # PyPI metadata SIGPIPE fix (post-v5.0.0)
    with:
      gh-workflows-ref: 49381314f7afd64afb580b77bab8ac263040c27e # PyPI metadata SIGPIPE fix (post-v5.0.0)
      runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION || 'ubuntu-22.04' }}
      jf-project: ${{ vars.JFROG_PROJECT }}
      jf-build-names: aerospike-client-python-native:${{ github.run_number }}
      jf-bundle-name: aerospike-client-python-native
      version: ${{ needs.extract-version.outputs.version }}
      oidc-provider-name: ${{ vars.OIDC_PROVIDER_NAME || 'gh-aerospike' }}
      oidc-audience: ${{ vars.OIDC_AUDIENCE || 'aerospike' }}
      dry-run: ${{ inputs.dry_run }}

  promote-release-bundle-dev:
    needs: [extract-version, create-release-bundle]
    if: ${{ inputs.dry_run == false }}
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION || 'ubuntu-22.04' }}
    steps:
      - name: Setup JFrog CLI
        uses: step-security/setup-jfrog-cli@3054b554c0fb4915b3d58847fb7730c593dbb934 # v5.0.0
        env:
          JF_URL: https://artifact.aerospike.io
          JF_PROJECT: ${{ vars.JFROG_PROJECT }}
        with:
          oidc-provider-name: ${{ vars.OIDC_PROVIDER_NAME || 'gh-aerospike' }}
          oidc-audience: ${{ vars.OIDC_AUDIENCE || 'aerospike' }}
      - name: Promote release bundle to DEV
        uses: aerospike/shared-workflows/.github/actions/promote-release-bundle@49381314f7afd64afb580b77bab8ac263040c27e # PyPI metadata SIGPIPE fix (post-v5.0.0)
        with:
          bundle-name: aerospike-client-python-native
          version: ${{ needs.extract-version.outputs.version }}
          environment: DEV
          jf-project: ${{ vars.JFROG_PROJECT }}
      - name: Promote release bundle to TEST
        if: ${{ inputs.promote-to-test }}
        uses: aerospike/shared-workflows/.github/actions/promote-release-bundle@49381314f7afd64afb580b77bab8ac263040c27e # PyPI metadata SIGPIPE fix (post-v5.0.0)
        with:
          bundle-name: aerospike-client-python-native
          version: ${{ needs.extract-version.outputs.version }}
          environment: TEST
          jf-project: ${{ vars.JFROG_PROJECT }}
