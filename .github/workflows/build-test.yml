name: CI Build & Test

on:
  pull_request:
    branches:
      - stage
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  # The shared server action exchanges an OIDC token for JFrog credentials.
  id-token: write

env:
  # Server build under test. Bump these two to move CI to a different build;
  # list what is available with the registry's docker tags/list endpoint.
  AEROSPIKE_SERVER_TAG: "8.2.0.0"
  AEROSPIKE_SERVER_REPO: database-docker-test-local/aerospike-server-enterprise

jobs:
  linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [
          # Don't run a virtual machine for x86_64 artifacts
          # maturin platform, Docker platform
          [x86_64, _],
          # aarch64 and armv7 disabled due to aws-lc-sys cross-compilation issues:
          #
          # Bindgen Feature Issue:
          # - Enabling bindgen forces libclang dependency across ALL targets
          # - This includes x86_64 which has pre-generated bindings and doesn't need bindgen
          # - libclang is often missing or incompatible in standard manylinux Docker containers
          # - This causes build failures in CI/CD environments
          # - Resolution: Removed bindgen feature to improve reliability
          #
          # ARM Cross-Compilation Issue:
          # - aarch64: __ARM_ARCH not defined when compiling ARM assembly files
          #   * aws-lc-sys tries to compile arm/aes/*.S files for aarch64
          #   * Cross-compiler (aarch64-unknown-linux-gnu-gcc) doesn't define __ARM_ARCH properly
          #   * Error: #error "ARM assembler must define __ARM_ARCH" in asm_base.h:77
          #   * AWS_LC_SYS_NO_ASM only works for debug builds, not release
          #   * Tested both aws-lc-sys 0.36.0 and 0.37.0 (latest, Jan 23, 2026) - both have the same issue
          # - armv7: bindgen/libclang not available in manylinux Docker
          #   * Requires bindgen which needs libclang
          #   * Pre-generated bindings not available for armv7
          #
          # See: https://github.com/aws/aws-lc-rs/issues
          #
          # Potential solutions:
          # - Wait for aws-lc-sys to fix ARM assembly compilation for aarch64
          # - Build without TLS for ARM targets (temporary workaround)
          # - Use custom manylinux Docker image with proper ARM cross-compilation setup
          # - Workaround: Install clang and set BINDGEN_EXTRA_CLANG_ARGS in Cross.toml
          #   (requires custom build environments, not suitable for standard CI)
          # [aarch64, linux/arm64],
          # [armv7, linux/arm/v7]
        ]
        python: [
          'python3.11',
          'python3.12',
          'python3.13',
          'python3.14',
          'python3.15'
        ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v3
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: Setup Python for maturin
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install specific Rust version
        run: |
          rustup install 1.90.0
          rustup default 1.90.0
          rustup show
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target[0] }}
          args: --release --out aerospike_native --interpreter ${{ matrix.python }}
          manylinux: auto
        env:
          # Force aws-lc-sys to use pre-generated bindings instead of bindgen/CMake
          # This avoids needing libclang and system headers in manylinux Docker containers
          # Caveat: maturin-action forwards only a prefix allowlist (CARGO_,
          # MATURIN_, PYO3_, RUST*, ...) into its container; AWS_LC_SYS_*
          # matches none of them, so these reach only host-side builds.
          AWS_LC_SYS_CMAKE_BUILDER: "0"
          AWS_LC_SYS_EXTERNAL_BINDGEN: "0"
          # Ensure pre-generated bindings are used (don't skip them)
          AWS_LC_SYS_NO_PREGENERATED_SRC: "0"

      - name: Run Aerospike server
        id: aerospike
        uses: aerospike/shared-workflows/.github/actions/setup-aerospike-server@49381314f7afd64afb580b77bab8ac263040c27e # PyPI metadata SIGPIPE fix (post-v5.0.0)
        with:
          server-tag: ${{ env.AEROSPIKE_SERVER_TAG }}
          server-container-repo: ${{ env.AEROSPIKE_SERVER_REPO }}
          num-nodes: 1
          config-file: .github/aerospike.conf
          oidc-provider: ${{ vars.OIDC_PROVIDER_NAME || 'gh-aerospike' }}
          oidc-audience: ${{ vars.OIDC_AUDIENCE || 'aerospike' }}

      - name: Assert the server is the one we asked for
        env:
          EXPECTED_BUILD: ${{ env.AEROSPIKE_SERVER_TAG }}
        run: python3 .github/assert-server.py

      - name: Remove python prefix for setting up python (CPython only)
        run: echo PYTHON_VERSION=$(echo ${{ matrix.python }} | sed -E "s/python(.*)/\1/") >> $GITHUB_ENV

      - name: Setup Python for testing
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true

      - name: Install wheel
        run: ${{ matrix.python }} -m pip install *.whl
        working-directory: aerospike_native
      - name: Install pytest
        run: ${{ matrix.python }} -m pip install pytest pytest-asyncio

      - name: Debug module contents
        run: |
          ${{ matrix.python }} -c "import aerospike_native; print('Module imported successfully')"
          ${{ matrix.python }} -c "import aerospike_native; print('Available functions:', [x for x in dir(aerospike_native) if not x.startswith('_')])"
      - name: Run tests
        env:
          AEROSPIKE_HOST: localhost:3000
          AEROSPIKE_USE_SERVICES_ALTERNATE: "true"
        run: |
          # Remove only the __init__.py file to prevent import conflicts with installed package
          # Keep the exceptions/ directory as it's needed by the tests
          rm -f python/aerospike_native/__init__.py
          # Remove .env file so tests use default localhost:3000 (matches our server)
          rm -f aerospike.env
          # Run all tests (excluding slow tests in CI)
          export PNC_FAILURE_TIMES="$RUNNER_TEMP/pnc-failure-times.txt"
          ${{ matrix.python }} -m pytest python/tests -v -s -m "not slow" || TEST_FAILED=true
          if [ "$TEST_FAILED" = "true" ]; then
            ${{ matrix.python }} .github/scripts/server_log_window.py "${{ steps.aerospike.outputs.container-names }}" "$PNC_FAILURE_TIMES"
            exit 1
          fi

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.python }}-${{ matrix.target[0] }}
          path: aerospike_native

  # Native ARM64 Linux build (no cross-compilation needed)
  linux-arm:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        python: [
          'python3.11',
          'python3.12',
          'python3.13',
          'python3.14',
          'python3.15'
        ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: Setup Python for maturin
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --out aerospike_native --interpreter ${{ matrix.python }}
          manylinux: auto
        env:
          AWS_LC_SYS_CMAKE_BUILDER: "0"
          AWS_LC_SYS_EXTERNAL_BINDGEN: "0"
          AWS_LC_SYS_NO_PREGENERATED_SRC: "0"

      - name: Run Aerospike server
        id: aerospike
        uses: aerospike/shared-workflows/.github/actions/setup-aerospike-server@49381314f7afd64afb580b77bab8ac263040c27e # PyPI metadata SIGPIPE fix (post-v5.0.0)
        with:
          server-tag: ${{ env.AEROSPIKE_SERVER_TAG }}
          server-container-repo: ${{ env.AEROSPIKE_SERVER_REPO }}
          num-nodes: 1
          config-file: .github/aerospike.conf
          oidc-provider: ${{ vars.OIDC_PROVIDER_NAME || 'gh-aerospike' }}
          oidc-audience: ${{ vars.OIDC_AUDIENCE || 'aerospike' }}

      - name: Assert the server is the one we asked for
        env:
          EXPECTED_BUILD: ${{ env.AEROSPIKE_SERVER_TAG }}
        run: python3 .github/assert-server.py

      - name: Remove python prefix for setting up python
        run: echo PYTHON_VERSION=$(echo ${{ matrix.python }} | sed -E "s/python(.*)/\1/") >> $GITHUB_ENV

      - name: Setup Python for testing
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true

      - name: Install wheel
        run: ${{ matrix.python }} -m pip install *.whl
        working-directory: aerospike_native
      - name: Install pytest
        run: ${{ matrix.python }} -m pip install pytest pytest-asyncio

      - name: Debug module contents
        run: |
          ${{ matrix.python }} -c "import aerospike_native; print('Module imported successfully')"
          ${{ matrix.python }} -c "import aerospike_native; print('Available functions:', [x for x in dir(aerospike_native) if not x.startswith('_')])"
      - name: Run tests
        env:
          AEROSPIKE_HOST: localhost:3000
          AEROSPIKE_USE_SERVICES_ALTERNATE: "true"
        run: |
          # Remove only the __init__.py file to prevent import conflicts with installed package
          rm -f python/aerospike_native/__init__.py
          # Remove .env file so tests use default localhost:3000
          rm -f aerospike.env
          # Run all tests (excluding slow tests in CI)
          export PNC_FAILURE_TIMES="$RUNNER_TEMP/pnc-failure-times.txt"
          ${{ matrix.python }} -m pytest python/tests -v -s -m "not slow" || TEST_FAILED=true
          if [ "$TEST_FAILED" = "true" ]; then
            ${{ matrix.python }} .github/scripts/server_log_window.py "${{ steps.aerospike.outputs.container-names }}" "$PNC_FAILURE_TIMES"
            exit 1
          fi

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-arm64-${{ matrix.python }}
          path: aerospike_native

  windows:
    runs-on: windows-2022
    strategy:
      matrix:
        target: [x64]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      # Restores ~/.cargo and the dependency half of target/ from the previous
      # run. Must come after the toolchain is installed -- the cache key
      # includes the rustc version.
      #
      # This is not sccache by another name. sccache cached individual rustc
      # invocations through a network API, which meant ~200 cache writes per
      # job; at this matrix width that blew through GitHub's 200-writes-per-
      # minute repository cap, every write failed, and the cache never
      # populated. rust-cache is one restore and one save per job, so the cap
      # is irrelevant. It also caches build-script output, which sccache did
      # not -- aws-lc-sys and mimalloc-sys both compile C here.
      #
      # shared-key ties all four interpreter cells to one cache entry instead
      # of four. The ~220 non-PyO3 dependencies are identical across them, and
      # a per-job key would multiply a multi-GB archive by four against the
      # 10 GB per-repository cache quota. Cargo rebuilds whatever the key
      # over-shares (the pyo3 crates, which are interpreter-specific).
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-x64

      - name: Install NASM
        run: |
          choco install nasm -y
          # Add NASM to PATH for subsequent steps (Chocolatey installs to Program Files)
          $nasmPath = "C:\Program Files\NASM"
          if (Test-Path $nasmPath) {
            echo "$nasmPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            # Verify NASM using full path (PATH won't be updated until next step)
            & "$nasmPath\nasm.exe" -v
          } else {
            # Fallback to Chocolatey bin directory
            echo "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            # Try to find nasm in common locations
            $chocoBin = "C:\ProgramData\chocolatey\bin\nasm.exe"
            if (Test-Path $chocoBin) {
              & $chocoBin -v
            } else {
              echo "NASM installed but path verification skipped (will be available in next step)"
            }
          }
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          architecture: ${{ matrix.target }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out aerospike_native --interpreter ${{ steps.setup-python.outputs.python-path }}
        env:
          # Force aws-lc-sys to use pre-generated bindings if available
          AWS_LC_SYS_CMAKE_BUILDER: "0"
          AWS_LC_SYS_EXTERNAL_BINDGEN: "0"

      # Windows can't run the Linux Aerospike server container, so this job is
      # build + import smoke only (same as macOS). Integration coverage for the
      # win_amd64 wheel runs in windows-integration below, against a server on
      # the paired remote Docker host.
      - name: Import smoke test
        run: |
          $whl = (Get-ChildItem aerospike_native\*.whl | Select-Object -First 1).FullName
          if (-not $whl) { throw "no wheel produced" }
          Write-Host "smoke testing $whl"
          & "${{ steps.setup-python.outputs.python-path }}" -m pip install --quiet $whl
          if ($LASTEXITCODE -ne 0) { throw "pip install failed" }
          & "${{ steps.setup-python.outputs.python-path }}" -c "import aerospike_native"
          if ($LASTEXITCODE -ne 0) { throw "import failed" }

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}-py${{ matrix.python }}
          path: aerospike_native

  # Integration tests for the win_amd64 wheel, on the self-hosted GCP Windows
  # fleet. Each Windows runner VM is paired with a Linux VM in the same VPC
  # whose Docker daemon it reaches through a machine-level DOCKER_HOST, so
  # every docker command below (the server action, docker logs) runs against
  # that VM and the client connects to it across the VPC instead of localhost.
  # Two constraints of that topology: only ports 3000/4333 are open from the
  # runner to the Linux VM, and `docker run -v <host path>` would resolve on
  # the Linux VM — the server action is safe (it ships configs into a named
  # volume with `docker cp`), but don't add bind mounts here.
  windows-integration:
    needs: windows
    # Skip (not queue) when the fleet isn't registered: a runs-on with no
    # matching runner waits until the workflow times out. Set the repo
    # variable WINDOWS_INTEGRATION_RUNNERS=true once the runners exist.
    if: vars.WINDOWS_INTEGRATION_RUNNERS == 'true'
    runs-on: [
      self-hosted,
      Windows,
      X64
    ]
    # Advisory, same contract as macos-arm-integration: self-hosted failures
    # here are more often environmental than defects in the wheel under test,
    # so a red must not gate the matrix. The last step surfaces the failure
    # as a warning annotation and a job-summary entry.
    continue-on-error: true
    timeout-minutes: 60
    defaults:
      run:
        # Git Bash from the runner image; keeps these steps identical to the
        # POSIX legs.
        shell: bash
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the remote Docker host
        run: |
          case "$DOCKER_HOST" in
            tcp://*) ;;
            *)
              echo "::error::DOCKER_HOST is '${DOCKER_HOST:-unset}'; this runner is not paired with a remote Docker VM"
              exit 1
              ;;
          esac
          host="${DOCKER_HOST#tcp://}"
          host="${host%%:*}"
          echo "SERVER_HOST=$host" >> "$GITHUB_ENV"

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: wheels-windows-x64-py${{ matrix.python }}
          path: aerospike_native

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          architecture: x64

      - name: Run Aerospike server
        id: aerospike
        uses: aerospike/shared-workflows/.github/actions/setup-aerospike-server@49381314f7afd64afb580b77bab8ac263040c27e # PyPI metadata SIGPIPE fix (post-v5.0.0)
        with:
          server-tag: ${{ env.AEROSPIKE_SERVER_TAG }}
          server-container-repo: ${{ env.AEROSPIKE_SERVER_REPO }}
          num-nodes: 1
          config-file: .github/aerospike.conf
          oidc-provider: ${{ vars.OIDC_PROVIDER_NAME || 'gh-aerospike' }}
          oidc-audience: ${{ vars.OIDC_AUDIENCE || 'aerospike' }}

      - name: Assert the server is the one we asked for
        # SERVER_HOST from the resolve step points it at the remote VM.
        env:
          EXPECTED_BUILD: ${{ env.AEROSPIKE_SERVER_TAG }}
        run: python .github/assert-server.py

      - name: Install wheel
        # This job runs on a persistent runner and the version string is
        # stable across merges, so a plain install is a no-op against
        # whatever build a previous run left behind.
        run: python -m pip install --force-reinstall *.whl
        working-directory: aerospike_native
      - name: Install pytest
        run: python -m pip install pytest pytest-asyncio

      - name: Assert the installed package matches the wheel under test
        run: |
          python - <<'EOF'
          import hashlib, pathlib, zipfile
          import aerospike_native
          installed_init = pathlib.Path(aerospike_native.__file__).resolve()
          [wheel] = pathlib.Path("aerospike_native").glob("*.whl")
          with zipfile.ZipFile(wheel) as zf:
              wheel_init = zf.read("aerospike_native/__init__.py")
          digest = lambda b: hashlib.sha256(b).hexdigest()
          installed, expected = digest(installed_init.read_bytes()), digest(wheel_init)
          assert installed == expected, (
              f"{installed_init} ({installed[:12]}) is not from {wheel.name} "
              f"({expected[:12]}) — a stale install is shadowing the wheel under test"
          )
          print(f"aerospike_native at {installed_init} matches {wheel.name} ({expected[:12]})")
          EOF

      - name: Debug module contents
        run: |
          python -c "import aerospike_native; print('Module imported successfully')"
          python -c "import aerospike_native; print('Available functions:', [x for x in dir(aerospike_native) if not x.startswith('_')])"

      - name: Run tests
        id: itest
        continue-on-error: true
        env:
          # The server is on the paired Linux VM, not localhost. Single node,
          # so the client keeps talking to this seed address throughout; the
          # container-scoped addresses the server advertises are never needed.
          AEROSPIKE_HOST: ${{ env.SERVER_HOST }}:3000
          AEROSPIKE_USE_SERVICES_ALTERNATE: "true"
        run: |
          # Remove only the __init__.py file to prevent import conflicts with installed package
          rm -f python/aerospike_native/__init__.py
          # Remove .env file so tests use the AEROSPIKE_HOST set above
          rm -f aerospike.env
          # Run all tests (excluding slow tests in CI)
          export PNC_FAILURE_TIMES="$RUNNER_TEMP/pnc-failure-times.txt"
          python -m pytest python/tests -v -s -m "not slow" || TEST_FAILED=true
          if [ "$TEST_FAILED" = "true" ]; then
            python .github/scripts/server_log_window.py "${{ steps.aerospike.outputs.container-names }}" "$PNC_FAILURE_TIMES"
            exit 1
          fi
      # GitHub has no "warn" job conclusion, so a soft-failed job would
      # otherwise report as green with nothing to notice.
      - name: Surface an advisory failure
        if: steps.itest.outcome == 'failure'
        run: |
          echo "::warning title=Windows integration failed (advisory)::python ${{ matrix.python }} failed on the self-hosted Windows runner; not gating the matrix"
          {
            echo "### :warning: Windows integration failed - advisory"
            echo ""
            echo "Python ${{ matrix.python }} on the self-hosted GCP Windows runner."
            echo "This does not gate the matrix. Check the runner and its paired"
            echo "Docker VM before concluding the code under test is at fault, and"
            echo "do not read a later green here as proof it was fixed."
          } >> "$GITHUB_STEP_SUMMARY"

  macos-x86:
    runs-on: macos-latest-large
    strategy:
      matrix:
        python: [
          'python3.11',
          'python3.12',
          'python3.13',
          'python3.14',
          'python3.15'
        ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      # Build-only: GitHub-hosted macOS Intel runners can't run Linux containers
      # (no usable nested virtualization; Homebrew has dropped the Intel podman
      # bottle), and ARM macOS runners can't virtualize either. Integration
      # coverage comes from the Linux x86_64 / aarch64 jobs, which exercise the
      # same Rust/Python logic. See macos-arm below.
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      # See the note on the windows job: one restore/save per job, caching
      # the dependency half of target/ plus build-script output.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos-x86

      - name: Setup Python for maturin
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # Install the target interpreter before the build: the runner image only
      # preinstalls the released versions.
      - name: Set target Python version
        run: echo PYTHON_VERSION=$(echo ${{ matrix.python }} | sed -E "s/python(.*)/\1/") >> $GITHUB_ENV
      - name: Setup target Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out aerospike_native --interpreter ${{ matrix.python }}
      # macOS 27's dyld rejects a misaligned string pool, but only in images
      # linked against the macOS 27 SDK. The import smoke below catches that
      # only when the runner has both, so check the layout directly.
      - name: Check string pool alignment
        run: python3 .github/scripts/check_macho_strtab.py aerospike_native/*.whl
      # Zero-container smoke: verify the freshly built wheel installs and imports
      # on macOS (catches link/ABI/symbol breakage the build step alone can miss).
      - name: Import smoke test
        run: |
          ${{ matrix.python }} -m pip install aerospike_native/*.whl
          ${{ matrix.python }} -c "import aerospike_native; print('import OK:', [x for x in dir(aerospike_native) if not x.startswith('_')][:5])"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-x86-${{ matrix.python }}
          path: aerospike_native

  # Build + import smoke on GitHub-hosted macos-latest (no Docker/vfkit).
  # Integration tests run on self-hosted macOS ARM64 in macos-arm-integration.
  macos-arm:
    runs-on: macos-latest
    strategy:
      matrix:
        python: [
          'python3.11',
          'python3.12',
          'python3.13',
          'python3.14',
          'python3.15'
        ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      # See the note on the windows job: one restore/save per job, caching
      # the dependency half of target/ plus build-script output.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos-arm

      - name: Setup Python for maturin
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # Install the target interpreter before the build: the runner image only
      # preinstalls the released versions.
      - name: Set target Python version
        run: echo PYTHON_VERSION=$(echo ${{ matrix.python }} | sed -E "s/python(.*)/\1/") >> $GITHUB_ENV
      - name: Setup target Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --out aerospike_native --interpreter ${{ matrix.python }}
      # See macos-x86: the import smoke can't reliably catch this.
      - name: Check string pool alignment
        run: python3 .github/scripts/check_macho_strtab.py aerospike_native/*.whl
      # Zero-container smoke: verify the freshly built wheel installs and imports
      # on macOS (catches link/ABI/symbol breakage the build step alone can miss).
      - name: Import smoke test
        run: |
          ${{ matrix.python }} -m pip install aerospike_native/*.whl
          ${{ matrix.python }} -c "import aerospike_native; print('import OK:', [x for x in dir(aerospike_native) if not x.startswith('_')][:5])"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-arm64-${{ matrix.python }}
          path: aerospike_native

  macos-arm-integration:
    needs: macos-arm
    runs-on: [
      self-hosted,
      macOS,
      ARM64
    ]
    # Advisory only: this is the one self-hosted bare-metal runner, and its
    # failures have been environmental (a same-version pip install silently
    # no-oping, framework python shadowing the venv) rather than defects in
    # the code under test, so a red here must not gate the matrix. Every
    # other target -- including the GitHub-hosted macOS jobs -- still fails
    # hard. The failure is surfaced as a warning annotation and in the job
    # summary by the last step: GitHub has no "warn" conclusion, so without
    # that continue-on-error would make the failure invisible instead.
    continue-on-error: true
    strategy:
      matrix:
        python: [
          '3.11',
          '3.12',
          '3.13',
          '3.14',
          '3.15'
        ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels-macos-arm64-python${{ matrix.python }}
          path: aerospike_native

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Run Aerospike server
        id: aerospike
        uses: aerospike/shared-workflows/.github/actions/setup-aerospike-server@49381314f7afd64afb580b77bab8ac263040c27e # PyPI metadata SIGPIPE fix (post-v5.0.0)
        with:
          server-tag: ${{ env.AEROSPIKE_SERVER_TAG }}
          server-container-repo: ${{ env.AEROSPIKE_SERVER_REPO }}
          num-nodes: 1
          config-file: .github/aerospike.conf
          oidc-provider: ${{ vars.OIDC_PROVIDER_NAME || 'gh-aerospike' }}
          oidc-audience: ${{ vars.OIDC_AUDIENCE || 'aerospike' }}

      - name: Assert the server is the one we asked for
        env:
          EXPECTED_BUILD: ${{ env.AEROSPIKE_SERVER_TAG }}
        run: python3 .github/assert-server.py

      - name: Install wheel
        # This job runs on a persistent bare-metal runner and the version
        # string is stable across merges, so a plain install is a no-op
        # against whatever build a previous run left behind.
        run: python3 -m pip install --force-reinstall *.whl
        working-directory: aerospike_native
      - name: Install pytest
        run: python3 -m pip install pytest pytest-asyncio

      - name: Assert the installed package matches the wheel under test
        run: |
          python3 - <<'EOF'
          import hashlib, pathlib, zipfile
          import aerospike_native
          installed_init = pathlib.Path(aerospike_native.__file__).resolve()
          [wheel] = pathlib.Path("aerospike_native").glob("*.whl")
          with zipfile.ZipFile(wheel) as zf:
              wheel_init = zf.read("aerospike_native/__init__.py")
          digest = lambda b: hashlib.sha256(b).hexdigest()
          installed, expected = digest(installed_init.read_bytes()), digest(wheel_init)
          assert installed == expected, (
              f"{installed_init} ({installed[:12]}) is not from {wheel.name} "
              f"({expected[:12]}) — a stale install is shadowing the wheel under test"
          )
          print(f"aerospike_native at {installed_init} matches {wheel.name} ({expected[:12]})")
          EOF

      - name: Debug module contents
        run: |
          python3 -c "import aerospike_native; print('Module imported successfully')"
          python3 -c "import aerospike_native; print('Available functions:', [x for x in dir(aerospike_native) if not x.startswith('_')])"

      - name: Run tests
        id: itest
        continue-on-error: true
        env:
          AEROSPIKE_HOST: localhost:3000
          AEROSPIKE_USE_SERVICES_ALTERNATE: "true"
        run: |
          # Remove only the __init__.py file to prevent import conflicts with installed package
          rm -f python/aerospike_native/__init__.py
          # Remove .env file so tests use default localhost:3000
          rm -f aerospike.env
          # Run all tests (excluding slow tests in CI)
          export PNC_FAILURE_TIMES="$RUNNER_TEMP/pnc-failure-times.txt"
          python3 -m pytest python/tests -v -s -m "not slow" || TEST_FAILED=true
          if [ "$TEST_FAILED" = "true" ]; then
            python3 .github/scripts/server_log_window.py "${{ steps.aerospike.outputs.container-names }}" "$PNC_FAILURE_TIMES"
            exit 1
          fi
      # GitHub has no "warn" job conclusion, so a soft-failed job would
      # otherwise report as green with nothing to notice. Emit an annotation
      # and a summary line, and keep the log as an artifact so an advisory
      # failure is still diagnosable.
      - name: Surface an advisory failure
        if: steps.itest.outcome == 'failure'
        run: |
          echo "::warning title=macOS ARM integration failed (advisory)::python ${{ matrix.python }} failed on the self-hosted runner; not gating the matrix"
          {
            echo "### :warning: macOS ARM integration failed - advisory"
            echo ""
            echo "Python ${{ matrix.python }} on the self-hosted bare-metal runner."
            echo "This does not gate the matrix. Check the runner environment"
            echo "before concluding the code under test is at fault, and do not"
            echo "read a later green here as proof it was fixed."
          } >> "$GITHUB_STEP_SUMMARY"


  macos-arm-freethreaded:
    runs-on: macos-latest
    strategy:
      matrix:
        python: ['3.14t', '3.15t']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      # See the note on the windows job: one restore/save per job, caches the
      # dependency half of target/ plus build-script output.
      # Shares macos-arm's entry: same runner and toolchain, so the ~220
      # non-PyO3 dependencies are identical. Cargo rebuilds the PyO3 crates,
      # which differ between the free-threaded and GIL ABIs.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos-arm

      - name: Setup free-threaded Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Build wheel (cp3Nt ABI auto-detected)
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --out aerospike_native --interpreter ${{ matrix.python }}
      # macOS GitHub runners can't run the Linux AS-server container, so this is
      # a build + import/GIL smoke only (no integration), like the GIL macos-arm job.
      - name: Import smoke + verify GIL stays disabled
        run: |
          python -m pip install aerospike_native/*.whl
          python -c "import sys; before=sys._is_gil_enabled(); import aerospike_native; after=sys._is_gil_enabled(); print(f'GIL before={before} after={after}'); assert before is False and after is False, 'gil_used=false not honored'"
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-arm64-${{ matrix.python }}
          path: aerospike_native

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out aerospike_native
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: aerospike_native

  # Free-threaded (PEP 703) Python builds.  Catches no-GIL regressions that
  # would otherwise land silently: anything that relies on the GIL for
  # de-facto serialization (module-level singletons, dict mutation races,
  # cross-loop asyncio primitives) fails here before it reaches users.
  linux-freethreaded:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-22.04
            target: x86_64
            python: '3.14t'
          - runs-on: ubuntu-24.04-arm
            target: aarch64
            python: '3.14t'
          - runs-on: ubuntu-22.04
            target: x86_64
            python: '3.15t'
          - runs-on: ubuntu-24.04-arm
            target: aarch64
            python: '3.15t'
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        # `actions-rs/toolchain` is archived; use the maintained replacement
        # for new jobs.  Existing jobs in this file still use the old action
        # and should be migrated in a separate cleanup pass.
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: Setup free-threaded Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Build wheel (cp3Nt ABI auto-detected)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out aerospike_native --interpreter ${{ matrix.python }}
          # Build against the host Python installed by setup-python above.
          # The container `manylinux: auto` selects (manylinux2014) has no
          # free-threaded CPython builds, so spinning one up causes maturin
          # to fail with "Couldn't find any python interpreters". The
          # manylinux_2_28 image release builds use *does* ship cp314t and
          # cp315t; this test leg just wants the host interpreter.
          # (3.13t was dropped — PyO3 0.29 removed support; FT now starts
          # at 3.14t.)
          manylinux: off
        env:
          AWS_LC_SYS_CMAKE_BUILDER: "0"
          AWS_LC_SYS_EXTERNAL_BINDGEN: "0"
          AWS_LC_SYS_NO_PREGENERATED_SRC: "0"
      - name: Run Aerospike server
        id: aerospike
        uses: aerospike/shared-workflows/.github/actions/setup-aerospike-server@49381314f7afd64afb580b77bab8ac263040c27e # PyPI metadata SIGPIPE fix (post-v5.0.0)
        with:
          server-tag: ${{ env.AEROSPIKE_SERVER_TAG }}
          server-container-repo: ${{ env.AEROSPIKE_SERVER_REPO }}
          num-nodes: 1
          config-file: .github/aerospike.conf
          oidc-provider: ${{ vars.OIDC_PROVIDER_NAME || 'gh-aerospike' }}
          oidc-audience: ${{ vars.OIDC_AUDIENCE || 'aerospike' }}

      - name: Assert the server is the one we asked for
        env:
          EXPECTED_BUILD: ${{ env.AEROSPIKE_SERVER_TAG }}
        run: python3 .github/assert-server.py
      - name: Install wheel
        run: python -m pip install aerospike_native/*.whl
      - name: Install pytest
        run: python -m pip install pytest pytest-asyncio
      - name: Verify GIL stays disabled after import
        run: |
          python -c "import sys; before = sys._is_gil_enabled(); import aerospike_native; after = sys._is_gil_enabled(); print(f'GIL before={before} after={after}'); assert before is False and after is False, 'gil_used = false flag is not being honored'"
      - name: Run tests
        env:
          AEROSPIKE_HOST: localhost:3000
          AEROSPIKE_USE_SERVICES_ALTERNATE: "true"
        run: |
          rm -f python/aerospike_native/__init__.py
          rm -f aerospike.env
          export PNC_FAILURE_TIMES="$RUNNER_TEMP/pnc-failure-times.txt"
          python -m pytest python/tests -v -s -m "not slow" || TEST_FAILED=true
          if [ "$TEST_FAILED" = "true" ]; then
            python .github/scripts/server_log_window.py "${{ steps.aerospike.outputs.container-names }}" "$PNC_FAILURE_TIMES"
            exit 1
          fi
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.python }}-${{ matrix.target }}
          path: aerospike_native

  lint:
    # Ruff and Clippy are pinned so a new release can't fail unchanged code.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install ruff
        run: pip install ruff==0.15.12
      - name: ruff
        run: ruff check python/
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.90.0
          override: true
          components: clippy
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  # The committed .pyi files are build outputs: regenerate them and fail if the
  # tree moved, so a Rust change cannot ship with a stale stub.
  stubs:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.90.0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Regenerate stubs
        run: make stubs
      - name: Stubs are current
        run: git diff --exit-code -- python/aerospike_native

  # Rust unit tests. The test binary links libpython, so this runs on the
  # runner host against setup-python's interpreter; a manylinux container has
  # no shared libpython to link.
  rust-unit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: cargo test
        env:
          # PyO3 otherwise links whichever interpreter it finds first.
          PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: make test-rust
