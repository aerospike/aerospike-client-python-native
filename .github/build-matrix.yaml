# Build cells for build-release.yaml, read by its plan-matrix job.
#
# Dev-channel builds publish the newest Python on linux x86_64 and macOS
# arm64 -- what local testing and benching use -- plus windows x64, which the
# SDK's Windows CI job installs, and 3.11 on linux x86_64 and aarch64, the
# oldest supported Python, for consumers pinned to it. Every supported version
# is still built and tested by the PR CI, and release builds publish all of
# them.
#
#   dev: true   both release and dev builds
#   dev: only   dev builds only
#   (absent)    release builds only
#
# The 3.15 cells are in dev builds too, so the SDK can test on 3.15 against a
# pinned dev build.
include:
  # Linux wheels build inside quay.io/pypa/manylinux_2_28 so the wheel
  # floor is the image's glibc (2.28), not the runner's (2.34 x86_64 /
  # 2.38 aarch64). python-interpreter is a space-separated list of
  # PEP 425 tags resolved to /opt/python/<tag>/bin/python in the image;
  # python-version only picks the host interpreter for stamp_version.py.
  # Dependency crates compile once per cell into a shared target/, so
  # one cell per interpreter (the Windows shape) would multiply the
  # image-pull + rustup overhead for little parallel win.
  #
  # 3.15 gets its own cell per architecture, so a build failure on the
  # newest Python doesn't take the other wheels down with it.
  - name: linux-x86_64-manylinux
    runs-on: ubuntu-22.04
    package-kind: wheel
    python-version: "3.13"
    python-interpreter: "cp311-cp311 cp312-cp312 cp313-cp313 cp314-cp314 cp314-cp314t"
    maturin-target: ""
    manylinux: "2_28"
  - name: linux-x86_64-manylinux-dev
    dev: only
    runs-on: ubuntu-22.04
    package-kind: wheel
    python-version: "3.13"
    python-interpreter: "cp311-cp311 cp314-cp314 cp314-cp314t"
    maturin-target: ""
    manylinux: "2_28"
  - name: linux-x86_64-manylinux-py315
    dev: true
    runs-on: ubuntu-22.04
    package-kind: wheel
    python-version: "3.13"
    python-interpreter: "cp315-cp315 cp315-cp315t"
    maturin-target: ""
    manylinux: "2_28"
  - name: linux-aarch64-manylinux
    runs-on: ubuntu-24.04-arm
    package-kind: wheel
    python-version: "3.13"
    python-interpreter: "cp311-cp311 cp312-cp312 cp313-cp313 cp314-cp314 cp314-cp314t"
    maturin-target: ""
    manylinux: "2_28"
  - name: linux-aarch64-manylinux-dev
    dev: only
    runs-on: ubuntu-24.04-arm
    package-kind: wheel
    python-version: "3.13"
    python-interpreter: "cp311-cp311"
    maturin-target: ""
    manylinux: "2_28"
  - name: linux-aarch64-manylinux-py315
    runs-on: ubuntu-24.04-arm
    package-kind: wheel
    python-version: "3.13"
    python-interpreter: "cp315-cp315 cp315-cp315t"
    maturin-target: ""
    manylinux: "2_28"
  - name: macos-x86_64-py311
    runs-on: macos-latest-large
    package-kind: wheel
    python-version: "3.11"
    python-interpreter: python3.11
    maturin-target: ""
    manylinux: ""
  - name: macos-x86_64-py312
    runs-on: macos-latest-large
    package-kind: wheel
    python-version: "3.12"
    python-interpreter: python3.12
    maturin-target: ""
    manylinux: ""
  - name: macos-x86_64-py313
    runs-on: macos-latest-large
    package-kind: wheel
    python-version: "3.13"
    python-interpreter: python3.13
    maturin-target: ""
    manylinux: ""
  - name: macos-x86_64-py314
    runs-on: macos-latest-large
    package-kind: wheel
    python-version: "3.14"
    python-interpreter: python3.14
    maturin-target: ""
    manylinux: ""
  # 3.15 rows build against the release candidate (ABI-frozen at rc1) so
  # wheels are installable on day one of 3.15.0 final; switch the -dev
  # spellings to plain "3.15"/"3.15t" once the final release is out.
  # (The Linux manylinux-py315 cells build cp315/cp315t from the
  # container's interpreters, so only macOS/Windows carry -dev rows.)
  - name: macos-x86_64-py315
    runs-on: macos-latest-large
    package-kind: wheel
    python-version: "3.15-dev"
    python-interpreter: python3.15
    maturin-target: ""
    manylinux: ""
  - name: macos-arm64-py311
    runs-on: macos-latest
    package-kind: wheel
    python-version: "3.11"
    python-interpreter: python3.11
    maturin-target: ""
    manylinux: ""
  - name: macos-arm64-py312
    runs-on: macos-latest
    package-kind: wheel
    python-version: "3.12"
    python-interpreter: python3.12
    maturin-target: ""
    manylinux: ""
  - name: macos-arm64-py313
    runs-on: macos-latest
    package-kind: wheel
    python-version: "3.13"
    python-interpreter: python3.13
    maturin-target: ""
    manylinux: ""
  - name: macos-arm64-py314
    dev: true
    runs-on: macos-latest
    package-kind: wheel
    python-version: "3.14"
    python-interpreter: python3.14
    maturin-target: ""
    manylinux: ""
  - name: macos-arm64-py315
    dev: true
    runs-on: macos-latest
    package-kind: wheel
    python-version: "3.15-dev"
    python-interpreter: python3.15
    maturin-target: ""
    manylinux: ""
  - name: macos-arm64-py314t
    dev: true
    runs-on: macos-latest
    package-kind: wheel
    python-version: "3.14t"
    python-interpreter: python3.14t
    maturin-target: ""
    manylinux: ""
  - name: macos-arm64-py315t
    dev: true
    runs-on: macos-latest
    package-kind: wheel
    python-version: "3.15t-dev"
    python-interpreter: python3.15t
    maturin-target: ""
    manylinux: ""
  # One leg per interpreter, unlike the Linux container cells. Building
  # the whole 3.11-3.14 set in a single job serialized five full release
  # compiles (each also paying a choco nasm install) and made this the
  # longest job in the pipeline by a factor of three. Linux escapes that:
  # dependency crates compile once into a shared target/ and only pyo3
  # and the client crate itself rebuild per interpreter.
  - name: windows-x64-py311
    runs-on: windows-2022
    package-kind: wheel
    python-version: "3.11"
    python-interpreter: python
    maturin-target: ""
    manylinux: ""
  - name: windows-x64-py312
    runs-on: windows-2022
    package-kind: wheel
    python-version: "3.12"
    python-interpreter: python
    maturin-target: ""
    manylinux: ""
  - name: windows-x64-py313
    runs-on: windows-2022
    package-kind: wheel
    python-version: "3.13"
    python-interpreter: python
    maturin-target: ""
    manylinux: ""
  - name: windows-x64-py314
    dev: true
    runs-on: windows-2022
    package-kind: wheel
    python-version: "3.14"
    python-interpreter: python
    maturin-target: ""
    manylinux: ""
  - name: windows-x64-py315
    runs-on: windows-2022
    package-kind: wheel
    python-version: "3.15-dev"
    python-interpreter: python
    maturin-target: ""
    manylinux: ""
  - name: sdist
    runs-on: ubuntu-22.04
    package-kind: sdist
    python-version: "3.13"
    python-interpreter: ""
    maturin-target: ""
    manylinux: ""
