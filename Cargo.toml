[package]
name = "aerospike_native"
version = "1.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", default-features = false, features = ["indexmap"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
tokio = "1.40"
aerospike-core = { git = "https://github.com/aerospike/aerospike-client-rust", rev = "4e01966", package = "aerospike-core", features = ["rt-tokio", "dynamic-config", "serialization"] }
hex = "0.4"
# Metrics snapshots re-serialize through core's `serialization` feature; these
# convert the serde tree into plain Python dicts for `to_dict()`.
serde = "1"
serde_json = "1"
parking_lot = "0.12"  # match aerospike-core's PartitionStatus mutex (v3)
# Match aerospike-core's info/bins return type (order-preserving). The `indexmap`
# feature on pyo3 provides the IntoPyObject conversion so these map straight to
# ordered Python dicts.
indexmap = "2"
ordered-float = { version = "3", default-features = false }
pyo3-stub-gen = { version = "0.23", default-features = false, features = ["infer_signature"] }
log = "0.4"
pyo3-log = "0.13"
futures = "0.3"
# Same provider as core (`ring`): with a second one compiled in, rustls panics
# at handshake unless a process-wide CryptoProvider is installed first.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }
webpki-roots = { version = "1.0", optional = true }
# v3 (through 3.3.2) segfaults once the thread that first imported the module
# exits, and on macOS shares a fixed TLS slot with any other bundled v3.
mimalloc = { version = "0.1", features = ["v2"] }
rand = { version = "0.8", features = ["small_rng"] }
# Converts FLOAT16 vector elements to and from Python floats.
half = "2"

[build-dependencies]
# Re-exports pyo3's interpreter cfgs (Py_3_13, Py_GIL_DISABLED, …) via build.rs
# so the crate can gate FFI on the target Python ABI.
pyo3-build-config = "0.29"

[features]
default = ["extension-module", "tls"]
extension-module = ["pyo3/extension-module"]
tls = ["aerospike-core/tls", "tokio-rustls", "rustls", "webpki-roots"]

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1
